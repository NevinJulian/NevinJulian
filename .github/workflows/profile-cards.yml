name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # Add a PAT with repo + read:user as secret STATS_TOKEN to include private repos.
      # Without it the cards fall back to the workflow token and show public data only.
      CARD_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare output folder
        run: mkdir -p profile

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=NevinJulian&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=percentile&bg_color=00000000&title_color=9ad1f5&icon_color=9ad1f5&text_color=c9d1d9&ring_color=f2b84b&custom_title=GitHub%20activity
          path: profile/stats-dark.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=NevinJulian&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=percentile&bg_color=00000000&title_color=1f6391&icon_color=1f6391&text_color=24292f&ring_color=c7811a&custom_title=GitHub%20activity
          path: profile/stats-light.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=NevinJulian&layout=compact&langs_count=8&hide=jupyter%20notebook,tex&size_weight=0.5&count_weight=0.5&hide_border=true&bg_color=00000000&title_color=9ad1f5&text_color=c9d1d9&custom_title=Most%20used%20languages
          path: profile/top-langs-dark.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=NevinJulian&layout=compact&langs_count=8&hide=jupyter%20notebook,tex&size_weight=0.5&count_weight=0.5&hide_border=true&bg_color=00000000&title_color=1f6391&text_color=24292f&custom_title=Most%20used%20languages
          path: profile/top-langs-light.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NevinJulian
          github_token: ${{ env.CARD_TOKEN }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#c7811a&color_dots=#ebedf0,#cfe3f3,#8ec1e6,#3f8cc4,#1f6391
            profile/snake-dark.svg?palette=github-dark&color_snake=#f2b84b&color_dots=#161b22,#0e3a52,#155e86,#2b8bc2,#9ad1f5

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
